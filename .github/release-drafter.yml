name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '💥 Breaking changes'
    labels: [breaking]
  - title: '✨ Features'
    labels: [feat]
  - title: '🐛 Fixes'
    labels: [fix]
  - title: '♻️ Maintenance'
    labels: [refactor, chore]
  - title: '🧪 Tests'
    labels: [test]
  - title: '📚 Documentation'
    labels: [docs]
  - title: '⬆️ Dependencies'
    collapse-after: 5
    labels: [dependencies]

exclude-labels:
  - skip-changelog

# GitHub does not autolink `#123` in a release body, so the link is spelled out.
change-template: '- $TITLE ([#$NUMBER]($URL))'
# A `<`, `_` or `&` in a pull request title would break the Markdown of the notes.
change-title-escapes: '\<*_&'
no-changes-template: '- No changes'

# The category already tells the type, so the Conventional Commits prefix is dropped from each line.
replacers:
  - search: '/^- (?:feat|fix|refactor|perf|test|docs|chore|ci|build|style)(?:\([^)]*\))?!?: /gm'
    replace: '- '

version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feat]
  default: patch

autolabeler:
  - label: breaking
    title: ['/^[a-z]+(\([^)]*\))?!:/']
  - label: feat
    title: ['/^feat(\([^)]*\))?!?:/']
  - label: fix
    title: ['/^fix(\([^)]*\))?!?:/']
  - label: refactor
    title: ['/^(refactor|perf)(\([^)]*\))?!?:/']
  - label: test
    title: ['/^test(\([^)]*\))?!?:/']
  - label: docs
    title: ['/^docs(\([^)]*\))?!?:/']
  - label: chore
    title: ['/^(chore|ci|build|style)(\([^)]*\))?!?:/']

template: |
  $CHANGES
