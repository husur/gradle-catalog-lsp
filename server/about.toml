# MIT first: its text carries each crate's copyright line, which the Apache-2.0 text leaves out.
accepted = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Unicode-3.0", "CDLA-Permissive-2.0"]
# The targets of .github/workflows/release.yml.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
private = { ignore = true }
